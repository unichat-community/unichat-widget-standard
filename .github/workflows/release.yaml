name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

defaults:
  run:
    shell: bash

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: |
          export PACKAGE_VERSION="$(jq -r '.version' package.json)"
          TAG_NAME="${{ github.ref_name }}"
          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "Error: The version in package.json ($PACKAGE_VERSION) does not match the release tag ($TAG_NAME)."
            exit 1
          fi

  package:
    needs: [prepare-release]
    uses: ./.github/workflows/package.yaml

  publish:
    runs-on: ubuntu-24.04
    needs: [package]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download widget build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: widget-bundle
          path: target/widget-bundle

      - name: Pack widget
        run: |
          export VERSION="${{ github.ref_name }}"
          export WIDGET_NAME="$(jq -r '.name | split("/") | last | sub("^unichat-widget-"; "")' package.json)"
          mkdir -p dist "target/package/$WIDGET_NAME"
          cp -r target/widget-bundle/. "target/package/$WIDGET_NAME/"
          (cd target/package && zip -r "../../dist/$WIDGET_NAME-$VERSION.zip" "$WIDGET_NAME")
          for file in dist/*; do
            if [ -f "$file" ]; then
              (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
            fi
          done

      - name: Create and upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"+"* ]]; then
            gh release create "$VERSION" dist/* --prerelease
          else
            gh release create "$VERSION" dist/*
          fi
